<!DOCTYPE HTML>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EngineSoft.com</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@200..700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css"
</head>

<body>
    <header>
        <nav>
            <img src="images/EngineSoft.png" alt="Enginesoft Logo">

            <div class="search-container">
                <input type="text" placeholder="Search..." aria-label="Search">
            </div>


            <ul>
                <li>
                    <a href="#">
                        <img src="images/Forum.png" alt="Forum icon">
                    </a>
                </li>
                <li>
                    <a href="#">
                        <img src="images/Notifications.png" alt="Forum icon">
                    </a>
                </li>
                <li>
                    <a href="#">
                        <img src="images/User.png" alt="Forum icon">
                    </a>
                </li>
            </ul>
        </nav>

        <section id="hero">
            <div id="popup">
                <div class="title">Find your potential.</div>
                <br>
                <div class="subtitle">Explore hundreds of engines to unleash your dreams.</div>
                <br>
                <button class="button">Get Started</button>
            </div>
            <img src="images/GameEngines.png" alt="Game Engine Logos" class="GEimage">
        </section>

    </header>
</body>
</html>
